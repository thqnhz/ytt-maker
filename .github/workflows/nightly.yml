name: Nightly build

on:
  schedule:
    # Daily at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libxkbcommon-x11-dev libxcb1-dev

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/
          cp "target/${{ matrix.target }}/release/yttm" dist/
          cp LICENSE dist/
          tar -czf "yttm-nightly-${{ matrix.name }}.tar.gz" -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/yttm.exe" dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "yttm-nightly-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.name }}
          path: |
            yttm-nightly-${{ matrix.name }}.tar.gz
            yttm-nightly-${{ matrix.name }}.zip
          archive: false # already compressed
          if-no-files-found: error

  release:
    name: Rolling nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          path: artifacts
          merge-multiple: true

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eou pipefail
          TAG="nightly"
          TITLE="Nightly ($(date -u +'%Y-%m-%d'))"
          SHA="${GITHUB_SHA}"
          BODY="Automated nightly build from \`${SHA}\` on $(date -u +'%Y-%m-%d %H:%M UTC')."

          # Remove previous nightly releases
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # Move the nightly tag to the current commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "$TITLE"
          git push -f origin "refs/tags/$TAG"

          # Create prerelease
          gh release create "$TAG" artifacts/* \
            --prerelease \
            --title "$TITLE" \
            --notes "$BODY" \
            --latest=false
