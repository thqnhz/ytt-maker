name: Nightly build

on:
  schedule:
    # Daily at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libxkbcommon-x11-dev libxcb1-dev libmpv-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest --jq .tag_name
          $asset = gh api "repos/shinchiro/mpv-winbuild-cmake/releases/tags/$tag" --jq '.assets[] | select(.name | test("^mpv-dev-x86_64-.*\\.7z$")) | .name' | Select-Object -First 1
          if (-not $asset) { throw "mpv-dev asset not found" }
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/$asset"
          Invoke-WebRequest $url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev | Out-Null
          $libDir = Resolve-Path "mpv-dev\\*\\libmpv*\\*" | Select-Object -First 1 -ExpandProperty Path
          if (-not (Test-Path "$libDir\\libmpv.lib")) { throw "libmpv.lib not found in $libDir" }
          Add-Content $env:GITHUB_PATH $libDir
          Add-Content $env:GITHUB_ENV "LIB=$libDir;$env:LIB"

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/
          cp "target/${{ matrix.target }}/release/yttm" dist/
          cp LICENSE dist/
          tar -czf "yttm-nightly-${{ matrix.name }}.tar.gz" -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/yttm.exe" dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "yttm-nightly-${{ matrix.name }}.zip"

          # Tar it so download-artifact later would not unzip it
          # Why the fuck would you auto unzip the artifact after download????????????????

          tar -cf "yttm-nightly-${{ matrix.name }}.zip.tar" "yttm-nightly-${{ matrix.name }}.zip"
          Remove-Item "yttm-nightly-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.name }}
          path: |
            yttm-nightly-${{ matrix.name }}.tar.gz
            yttm-nightly-${{ matrix.name }}.zip.tar
          archive: false # already compressed
          if-no-files-found: error

  release:
    name: Rolling nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: yttm-nightly-*
          path: artifacts

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eou pipefail

          echo "Downloaded files:"
          find artifacts -type f -print || true

          # Look at this horrible thing
          while IFS= read -r -d '' f; do
            tar -xf "$f" -C "$(dirname "$f")"
            rm -f "$f"
          done < <(find artifacts -type f -name '*.zip.tar' -print0)

          mapfile -t assets < <(find artifacts -type f \( -name 'yttm-nightly-*.tar.gz' -o -name 'yttm-nightly-*.zip' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          printf 'Release assets:\n%s\n' "${assets[@]}"

          TAG="nightly"
          TITLE="Nightly ($(date -u +'%Y-%m-%d'))"
          SHA="${GITHUB_SHA}"
          BODY="Automated nightly build from \`${SHA}\` on $(date -u +'%Y-%m-%d %H:%M UTC')."

          # Remove previous nightly releases
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # Move the nightly tag to the current commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -fa "$TAG" -m "$TITLE"
          git push -f origin "refs/tags/$TAG"

          # Create prerelease
          gh release create "$TAG" "${assets[@]}" \
            --target "$SHA" \
            --prerelease \
            --title "$TITLE" \
            --notes "$BODY" \
            --latest=false
