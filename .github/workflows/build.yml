name: Manually triggered build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libxkbcommon-x11-dev libxcb1-dev

      - name: Build
        run: make rel

      - name: Compress
        run: |
          mkdir -p dist/
          mv ./target/release/yttm dist/
          mv LICENSE dist/
          7z a -tzip yttm.zip -mx=9 dist/

      - uses: actions/upload-artifact@v7
        with:
          archive: false # already compressed
          path: yttm.zip
