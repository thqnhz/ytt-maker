[workspace]
resolver = "3"
members = [
    "crates/yttm",
    "crates/yttm-core",
    "crates/yttm-ui",
    "crates/yttm-input",
    "crates/yttm-playback",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ZyubyL <zyubyl@gmail.com>"]
license-file = "LICENSE"
readme = "README.md"

[workspace.dependencies]
gpui-kit = "0.9.1"
anyhow = "1"
libmpv2 = "7.0.1"
libmpv2-sys = "4.0.1"
image = { version = "0.25", default-features = false }
smallvec = "1"

# Local deps
yttm-core = { path = "crates/yttm-core" }
yttm-input = { path = "crates/yttm-input" }
yttm-playback = { path = "crates/yttm-playback" }
yttm-ui = { path = "crates/yttm-ui" }
